//PARSER
const DAY_RE=new RegExp('^(Lunes|Martes|Mi[eé]rcoles|Jueves|Viernes|S[aá]bado|Domingo)\\b\\.?\\s*(\\d{1,2})?','i');
const PLACES=['arroyo dulce','rancagua','luard kayard'];
const ORD={Lunes:0,Martes:1,Miércoles:2,Jueves:3,Viernes:4,Sábado:5,Domingo:6};
const isNoise=l=>/^(salidas\s+(de\s+)?congregaci[oó]n|¿?alguna\s+duda\??)$/i.test(l.replace(/[^\p{L}\s?]/gu,'').trim());
const isTerrList=l=>/^\d{1,3}\s*[-–]\s*\d{1,3}(\s*(y|e|,|\/)\s*\d{1,3})*\.?$/.test(l);
const SKIP=/cada\s+uno|\bc\/u\b/i;
const cap=s=>s.replace(/(^|\s)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const normName=s=>s.toLowerCase().replace(/[^\p{L}\s]/gu,'').replace(/\s+/g,' ').trim();
const lead=s=>s.replace(/^[^\p{L}0-9]+/u,'').trim();
function normDay(n){const k=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return k==='miercoles'?'Miércoles':k==='sabado'?'Sábado':k[0].toUpperCase()+k.slice(1)}
function inferNum(n,last){if(!last)return'';const d=ORD[n]-ORD[last.name];return isNaN(d)?'':String(last.num+d)}
function fields(parts){
  let txt=parts.map(p=>p.replace(/\(?\bferiado\b\)?/ig,'').trim()).filter(Boolean).join(' | '),hora='',terr='',cond='';
  txt=txt.replace(/(\d{1,2})[:.](\d{2})\s*(?:hs?\b\.?)?/i,(m,h,mi)=>{hora=h.padStart(2,'0')+':'+mi;return' '});
  txt=txt.replace(/\b(?:terr(?:itorios?)?|t)\b\.?\s*[:;]?\s*(\d+(?:\s*(?:-|,|y|e)\s*\d+)*)/i,(m,t)=>{terr=t.replace(/\s*(?:y|e|,)\s*/gi,', ').replace(/\s*-\s*/g,'-');return' '});
  const cm=txt.match(/\bcond(?:uctor)?\b\.?\s*[:;]?\s*([^|]*)/i);
  if(cm){cond=cm[1];txt=txt.slice(0,cm.index)+' '+txt.slice(cm.index+cm[0].length)}
  let segs=txt.split('|').map(s=>s.trim()).filter(s=>s.replace(/[\W_]/g,''));
  if(cm){const k=normName(cond);segs=segs.filter(s=>normName(s)!==k)}
  else if(segs.length>1&&segs[segs.length-1].split(/\s+/).length<=4&&!/\)\s*\.?$/.test(segs[segs.length-1]))cond=segs.pop();
  else if(segs.length===1&&!/\)\s*\.?$/.test(segs[0])){const w=segs[0].replace(/[.\s]+$/,'').split(/\s+/);if(w.length>2){cond=w.slice(-2).join(' ');segs[0]=w.slice(0,-2).join(' ')}}
  const extra=[];
  cond=cond.replace(/\(([^)]*)\)/g,(m,x)=>{extra.push(x.trim());return' '});
  PLACES.forEach(p=>{const r=new RegExp(p,'i');if(r.test(cond)){extra.push(p);cond=cond.replace(r,' ')}});
  let w=cond.replace(/[.;:,|]/g,' ').split(/\s+/).filter(Boolean);
  const h=w.length/2;
  if(w.length>1&&w.length%2===0&&w.slice(0,h).join(' ').toLowerCase()===w.slice(h).join(' ').toLowerCase())w=w.slice(0,h);
  w=w.map(x=>cap(x));
  let lugar=segs.join(' ').replace(/\bT\b\.?\s*$/i,'').replace(/^[\s.,\-:;]+|[\s.,\-:;]+$/g,'').replace(/\s{2,}/g,' ');
  extra.forEach(x=>{if(x)lugar+=` (${cap(x)})`});
  lugar=lugar.charAt(0).toUpperCase()+lugar.slice(1);lugar=lugar.replace(/\(([^)]*)\)/g,(m,x)=>'('+cap(x)+')');
  return{hora,lugar:lugar.trim(),territorio:terr,conductor:w.join(' ')};
}
function parseMessage(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l&&!isNoise(l)&&!isTerrList(l));
  const out=[],blank=dia=>({dia,hora:'',lugar:'',territorio:'',conductor:'',manual:true});
  let i=0,last=null;
  while(i<lines.length){
    const clean=lead(lines[i]),hm=clean.match(DAY_RE);
    if(!hm){i++;continue}
    const name=normDay(hm[1]);let num=hm[2]||'',used=hm[0].length;
    if(num&&clean[used]===':'){used-=num.length;num=''}
    if(!num&&last&&last.name===name)num=String(last.num);
    if(num)last={name,num:+num};
    const dia=num?name+' '+num:name;
    const left=clean.slice(used).replace(/\(?\bferiado\b\)?/ig,'').trim();
    const combo=/^y\s+(domingo|s[aá]bado)/i.exec(left);
    let dia2='';
    if(combo){const n2=normDay(combo[1]),d=inferNum(n2,last);dia2=d?n2+' '+d:n2;if(d)last={name:n2,num:+d}}
    const next=lines[i+1]||'',hdr=lines[i];
    if(SKIP.test(left)||SKIP.test(next)){
      i+=SKIP.test(next)?2:1;
      const p=num?dia:(inferNum(name,last)?name+' '+inferNum(name,last):dia);
      const s0=hdr+(SKIP.test(next)?'\n'+next:'');out.push({...blank(p),src:s0});if(dia2)out.push({...blank(dia2),src:s0});continue;
    }
    const parts=[];if(left&&!combo)parts.push(left);
    let j=i+1;
    while(j<lines.length&&parts.length<2){if(DAY_RE.test(lead(lines[j])))break;parts.push(lines[j]);j++}
    i=j;
    if(parts.length)out.push({dia,...fields(parts),manual:false,src:[hdr,...parts.slice(left&&!combo?1:0)].join('\n')});
  }
  const w=out.findIndex(r=>/^Mi[ée]rcoles/i.test(r.dia));
  if(w!==-1)out.splice(w+1,0,blank(out[w].dia));
  return out;
}
///PARSER
function guessSub(r){
  const d=r.map(x=>x.dia.match(/^(\D+?)\s*(\d{1,2})$/)).filter(Boolean).map(m=>+m[2]);
  if(!d.length)return'';
  const t=new Date(),m1=t.getMonth()+1,a=d[0],b=d[d.length-1];
  return`Del ${a}/${m1} al ${b}/${b<a?(m1===12?1:m1+1):m1}`;
}

/* copia de seguridad (AES-GCM, formato propio .g7mem) */
async function ckey(){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode('G7-salidas-memoria-v1'),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode('g7-salt'),iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encMem(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(),new TextEncoder().encode(JSON.stringify({app:'g7',v:1,mem}))));const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return new Blob([new TextEncoder().encode('G7MEM1'),all],{type:'application/octet-stream'})}
async function decMem(buf){const u=new Uint8Array(buf);if(new TextDecoder().decode(u.slice(0,6))!=='G7MEM1')throw 0;const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(6,18)},await ckey(),u.slice(18));return JSON.parse(new TextDecoder().decode(pt)).mem}
function mergeMem(m){['nombres','lugares'].forEach(k=>{(m[k]||[]).forEach(v=>addMem(k,v));Object.assign(mem.rep[k],(m.rep||{})[k]||{})});saveMem()}

async function loadFonts(){try{await Promise.all(['400','600','700','italic 400'].map(w=>document.fonts.load(`${w} 40px "Barlow Semi Condensed"`)))}catch(e){}}
function drawCanvas(){
  const W=1600,rh=100,hh=104,top=270,cols=[20.39,12.76,50.96,10.5,29.84],tot=cols.reduce((a,b)=>a+b),M=40;
  const need=top+hh+rows.length*rh+M,cw=cols.map(c=>c/tot*(W-2*M)),H=cropOn?need:Math.max(need,Math.round(W*1.4142));
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';
  const fit=(t,w,s,st)=>{let z=s;do{x.font=`${st} ${z}px ${FF}`;z-=2}while(x.measureText(t).width>w-24&&z>14);x.fillText(t,0,0)};
  const put=(t,cx,cy,w,s,st)=>{x.save();x.translate(cx,cy);fit(t,w,s,st);x.restore()};
  put('Salidas de Congregación y del Grupo 7',W/2,100,W-2*M,70,'bold');
  put($('#sub').value||'',W/2,190,W-2*M,56,'bold');
  x.lineWidth=2.5;x.strokeStyle='#000';
  const line=(y,h,fill,items,bold,it,man)=>{
    let px=M;items.forEach((t,k)=>{
      if(fill){x.fillStyle=fill;x.fillRect(px,y,cw[k],h)}
      x.strokeRect(px,y,cw[k],h);x.fillStyle='#000';
      put(t,px+cw[k]/2,y+h/2,cw[k],bold?44:40,bold?'bold':(man?'600':(it[k]?'italic 400':'400')));
      px+=cw[k]});
  };
  line(top,hh,'#00FE7F',['Día','Hora','Lugar de encuentro','Territ.','Conductor'],true,[]);
  rows.forEach((r,i)=>line(top+hh+i*rh,rh,null,[r.dia,r.hora,r.lugar,r.territorio,r.conductor],false,[1,0,1,0,1],r.manual));
  return c;
}

  };
  $('#clear').onclick=()=>{$('#raw').value='';rows=[];$('#sub').value='';renderRows()};
  $('#addrow').onclick=()=>{rows.push({dia:'',hora:'',lugar:'',territorio:'',conductor:'',manual:false,src:''});renderRows();const c=$$('#rows .rc');c[c.length-1].classList.add('enter')};
  $('#rows').addEventListener('input',e=>{const t=e.target;if(t.dataset.f){rows[+t.dataset.i][t.dataset.f]=t.value;updatePreview()}});
  $('#sub').addEventListener('input',updatePreview);
  $('#crop').classList.toggle('on',cropOn);
  $('#cropr').onclick=()=>{cropOn=!cropOn;LS.set('g7_crop',cropOn);$('#crop').classList.toggle('on',cropOn);updatePreview()};
  $('#rows').addEventListener('change',()=>remember());
  $('#rows').addEventListener('keydown',e=>{

  });

  $('#rows').addEventListener('click',e=>{

  $('#b-wa').onclick=e=>guard(e.currentTarget,shareWA);
  $('#b-xl').onclick=e=>guard(e.currentTarget,makeXLSX);

  (function(){
    const f=$('#fs'),im=$('#fsimg'),P=new Map();let sc=1,x=0,y=0,s0=1,d0=1,lt=0;
    const ap=a=>{im.style.transition=a?'transform .28s cubic-bezier(.2,.8,.2,1)':'none';im.style.transform=`translate(${x}px,${y}px) scale(${sc})`};
    const lim=()=>{const mx=Math.max(0,(im.offsetWidth*sc-innerWidth)/2),my=Math.max(0,(im.offsetHeight*sc-innerHeight)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y))};
    const zoomAt=(s,cx,cy)=>{s=Math.min(5,Math.max(1,s));const r=s/sc,px=cx-innerWidth/2,py=cy-innerHeight/2;x=px-(px-x)*r;y=py-(py-y)*r;sc=s};
    const close=()=>{f.className='closing';setTimeout(()=>{f.className=''},200)};
    $('#pv').onclick=()=>{if(!pvURL)return;im.src=pvURL;sc=1;x=y=0;ap(false);f.className='open'};
    $('#fsx').onclick=close;
    f.addEventListener('pointerdown',e=>{
      if(e.target.closest('#fsx'))return;f.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
      if(P.size===2){const a=[...P.values()];d0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;s0=sc;lt=0}
      else{const n=Date.now();if(n-lt<300){zoomAt(sc>1.2?1:2.5,e.clientX,e.clientY);lim();ap(true);lt=0}else lt=n}
    });
    f.addEventListener('pointermove',e=>{
      if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);const a=[...P.values()];
      if(P.size===2){zoomAt(s0*Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])/d0,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);ap(false)}
      else if(sc>1){x+=e.clientX-o[0];y+=e.clientY-o[1];ap(false)}
    });
    const up=e=>{P.delete(e.pointerId);if(!P.size){lim();ap(true)}};
    f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up);
    f.addEventListener('wheel',e=>{e.preventDefault();zoomAt(sc*Math.exp(-e.deltaY*.002),e.clientX,e.clientY);lim();ap(false)},{passive:false});
    addEventListener('keydown',e=>{if(e.key==='Escape'&&f.classList.contains('open'))close()});
  })();
  $$('#mtabs button').forEach(b=>b.onclick=()=>{mtab=b.dataset.k;renderMem()});
  $('#madd').onclick=()=>{addMem(mtab,$('#mi').value);$('#mi').value='';saveMem();renderMem()};
  $('#mi').addEventListener('keydown',e=>{if(e.key==='Enter')$('#madd').click()});
  $('#mlist').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.r!==undefined)askRep(+b.dataset.r);
    else{const i=+b.dataset.d,v=mem[mtab][i];askDel(`Se va a eliminar «${esc(v)}» de la memoria.`,()=>{mem[mtab].splice(i,1);delete mem.rep[mtab][rk(v)];saveMem();renderMem()})}
  };
  $('#mclear').onclick=()=>askDel('Se van a eliminar todos los ítems de esta categoría.',()=>{mem[mtab]=[];mem.rep[mtab]={};saveMem();renderMem()});
  $('#mbk').onclick=async()=>{try{await out(await encMem(),'Memoria_G7.g7mem','application/octet-stream')}catch(e){toast('No se pudo crear la copia')}};
  $('#mimp').onclick=()=>$('#fi').click();
  $('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{mergeMem(await decMem(await f.arrayBuffer()));renderMem();toast('Memoria importada')}catch(x){toast('Archivo no válido')}};
});

<script>
(()=>{
const DB={o:null,open(){return this.o||(this.o=new Promise((res,rej)=>{try{const q=indexedDB.open('g7',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}))},
async tx(m,f){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv',m),r=f(t.objectStore('kv'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})},
get(k){return this.tx('readonly',s=>s.get(k))},set(k,v){return this.tx('readwrite',s=>s.put(v,k))},del(k){return this.tx('readwrite',s=>s.delete(k))}};
let mapBlob=null,mapURL='',terrs=[],mode='map',curT=0,sc=1,x=0,y=0,B={l:0,t:0,r:0,b:0},ct=0;
let tmode=LS.get('g7_tmode','hl'),hfix=LS.get('g7_hfix',false);
const mv=$('#mv'),mi=$('#mvi'),fi2=$('#mfi'),cb=$('#cb'),pick=()=>fi2.click();
const urlOf=t=>t.u||(t.u=URL.createObjectURL(t.blob)),drop=t=>{if(t&&t.u)URL.revokeObjectURL(t.u)};
const saveMap=async()=>{try{mapBlob?await DB.set('map',mapBlob):await DB.del('map')}catch(e){}};
const saveT=async()=>{try{await DB.set('terrs',terrs.map(({num,blob})=>({num,blob})))}catch(e){}};
window.renderTerr=function(){
  $('#mz').classList.toggle('has',!!mapURL);const im=$('#mimg');mapURL?im.src=mapURL:im.removeAttribute('src');
  $('#tg').innerHTML=terrs.map((t,i)=>`<div class="th" data-t="${i}"><img src="${urlOf(t)}" decoding="async" alt=""></div>`).join('');
};
/* miniaturas bajo cada salida */
const nums=s=>{const o=[];(s||'').replace(/(\d+)\s*-\s*(\d+)|(\d+)/g,(m,a,b,c)=>{if(c)o.push(+c);else{const p=+a,q=+b;if(q>=p&&q-p<=15)for(let k=p;k<=q;k++)o.push(k);else o.push(p,q)}});return[...new Set(o)]};
window.refreshTP=function(){$$('.tp').forEach(el=>{
  const r=rows[+el.dataset.tp];if(!r)return;
  const list=nums(r.territorio).filter(n=>terrs.some(t=>t.num===n)),show=list.length&&(tmode==='all'||(tmode==='hl'&&r.manual)),key=list.join(),tr=el.querySelector('.tr');
  clearTimeout(el._t);
  if(show){if(el.dataset.k!==key){el.dataset.k=key;tr.innerHTML=list.map(n=>`<img src="${urlOf(terrs.find(t=>t.num===n))}" data-n="${n}" decoding="async" alt="">`).join('')}el.classList.add('on')}
  else{el.classList.remove('on');el.dataset.k='';el._t=setTimeout(()=>{if(!el.classList.contains('on'))tr.innerHTML=''},550)}
})};
$('#rows').addEventListener('input',e=>{if(e.target.dataset.f==='territorio')setTimeout(refreshTP,0)});
$('#rows').addEventListener('click',e=>{
  if(e.target.closest('.ck'))setTimeout(refreshTP,0);
  const im=e.target.closest('.tr img');if(im){const i=terrs.findIndex(t=>t.num===+im.dataset.n);if(i>=0)openView('ter',i)}
});
/* ajustes */
const applyS=()=>{$$('#tmode button').forEach(b=>b.classList.toggle('on',b.dataset.m===tmode));$('#tmode').style.setProperty('--i',['never','hl','all'].indexOf(tmode));$('#hsw').classList.toggle('on',hfix);document.body.classList.toggle('hfix',hfix)};
$('#tmode').onclick=e=>{const b=e.target.closest('button');if(!b)return;tmode=b.dataset.m;LS.set('g7_tmode',tmode);applyS();refreshTP()};
$('#hfx').onclick=()=>{hfix=!hfix;LS.set('g7_hfix',hfix);applyS()};
applyS();
function setMap(f){
  if(!f)return;if(!f.type.startsWith('image/'))return toast('Elegí una imagen');
  if(mapURL)URL.revokeObjectURL(mapURL);mapBlob=f;mapURL=URL.createObjectURL(f);saveMap();renderTerr();
  if(mv.classList.contains('open')&&mode==='map'){mv.classList.remove('empty');showImg(mapURL)}
}
fi2.onchange=e=>{const f=e.target.files[0];e.target.value='';setMap(f)};
/* visor */
const ap=(a,d)=>{mi.style.transition=a?`transform ${d||.28}s cubic-bezier(.2,.8,.2,1)`:'none';mi.style.transform=`translate(${x}px,${y}px) scale(${sc})`};
const lim=()=>{const mx=Math.max(0,(mi.offsetWidth*sc-innerWidth)/2),my=Math.max(0,(mi.offsetHeight*sc-innerHeight)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y))};
const zoomAt=(s,cx,cy)=>{s=Math.min(8,Math.max(.85,s));const r=s/sc,px=cx-innerWidth/2,py=cy-innerHeight/2;x=px-(px-x)*r;y=py-(py-y)*r;sc=s};
function showImg(u){mi.src=u;sc=1;x=y=0;ap(false)}
function openView(m,i){
  mode=m;curT=i;clearTimeout(ct);mv.className='open '+m+(m==='map'&&!mapURL?' empty':'');
  if(m==='map'){if(mapURL)showImg(mapURL)}
  else{showImg(urlOf(terrs[i]));$('#mvn').textContent=terrs[i].num}
}
function closeView(){mv.classList.remove('open','crop');ct=setTimeout(()=>{if(!mv.classList.contains('open'))mv.className=''},450)}
const P2=new Map();let s0=1,d0=1,lt=0,mvS=null,mvP;
const skip=e=>mv.classList.contains('empty')||e.target.closest('.ib,.btn,.h');
const bd=()=>({L:8,R:innerWidth-8,T:84,Bt:innerHeight-118});
const paint=()=>Object.assign(cb.style,{left:B.l+'px',top:B.t+'px',width:B.r-B.l+'px',height:B.b-B.t+'px'});
mv.addEventListener('pointerdown',e=>{
  if(skip(e))return;mv.setPointerCapture(e.pointerId);P2.set(e.pointerId,[e.clientX,e.clientY]);
  if(P2.size===2){mvS=null;const a=[...P2.values()];d0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;s0=sc;lt=0}
  else if(mv.classList.contains('crop')&&e.target.id==='cbi'){mvS={...B};mvP=[e.clientX,e.clientY]}
  else{const n=Date.now();if(n-lt<300){zoomAt(sc>1.2?1:2.5,e.clientX,e.clientY);lim();ap(true);lt=0}else lt=n}
});
mv.addEventListener('pointermove',e=>{
  if(!P2.has(e.pointerId))return;const o=P2.get(e.pointerId);P2.set(e.pointerId,[e.clientX,e.clientY]);const a=[...P2.values()];
  if(P2.size===2){zoomAt(s0*Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])/d0,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);ap(false)}
  else if(mvS){const{L,R,T,Bt}=bd(),w=mvS.r-mvS.l,h=mvS.b-mvS.t,l=Math.min(Math.max(mvS.l+e.clientX-mvP[0],L),R-w),t=Math.min(Math.max(mvS.t+e.clientY-mvP[1],T),Bt-h);B={l,t,r:l+w,b:t+h};paint()}
  else if(sc>1){x+=e.clientX-o[0];y+=e.clientY-o[1];ap(false)}
});
const up=e=>{P2.delete(e.pointerId);mvS=null;if(!P2.size){if(sc<1){sc=1;x=y=0}lim();ap(true)}};
mv.addEventListener('pointerup',up);mv.addEventListener('pointercancel',up);
mv.addEventListener('wheel',e=>{if(skip(e))return;e.preventDefault();zoomAt(sc*Math.exp(-e.deltaY*.002),e.clientX,e.clientY);lim();ap(false)},{passive:false});
mv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key==='Escape'&&mv.classList.contains('open'))closeView()});
/* recorte */
const MIN=90;
function startCrop(){const W=innerWidth,H=innerHeight;B={l:W*.1,r:W*.9,t:H*.24,b:H*.68};paint();mv.classList.add('crop')}
function fitSel(){
  const W=innerWidth,H=innerHeight,L=18,R=W-18,T=88,Bt=H-124;
  let f=Math.min((R-L)/(B.r-B.l),(Bt-T)/(B.b-B.t));f=Math.min(f,8/sc);if(f<1.04)return;
  const cx=W/2,cy=H/2,bc=[(B.l+B.r)/2,(B.t+B.b)/2],nc=[(L+R)/2,(T+Bt)/2],ns=sc*f;
  let nx=nc[0]-cx-f*(bc[0]-cx-x),ny=nc[1]-cy-f*(bc[1]-cy-y);
  const mx=Math.max(0,(mi.offsetWidth*ns-W)/2),my=Math.max(0,(mi.offsetHeight*ns-H)/2);nx=Math.min(mx,Math.max(-mx,nx));ny=Math.min(my,Math.max(-my,ny));
  const k=ns/sc,m=(px,py)=>[cx+nx+k*(px-cx-x),cy+ny+k*(py-cy-y)],a=m(B.l,B.t),b=m(B.r,B.b);
  sc=ns;x=nx;y=ny;B={l:Math.max(L,a[0]),t:Math.max(T,a[1]),r:Math.min(R,b[0]),b:Math.min(Bt,b[1])};
  cb.classList.add('anim');paint();ap(true,.55);setTimeout(()=>cb.classList.remove('anim'),600);
}
cb.querySelectorAll('.h').forEach(h=>{
  const d=h.dataset.d;let s=null,p0;
  h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();h.setPointerCapture(e.pointerId);s={...B};p0=[e.clientX,e.clientY]};
  h.onpointermove=e=>{if(!s)return;const dx=e.clientX-p0[0],dy=e.clientY-p0[1],{L,R,T,Bt}=bd();
    if(d.includes('w'))B.l=Math.min(Math.max(s.l+dx,L),s.r-MIN);
    if(d.includes('e'))B.r=Math.max(Math.min(s.r+dx,R),s.l+MIN);
    if(d.includes('n'))B.t=Math.min(Math.max(s.t+dy,T),s.b-MIN);
    if(d.includes('s'))B.b=Math.max(Math.min(s.b+dy,Bt),s.t+MIN);paint()};
  h.onpointerup=h.onpointercancel=()=>{if(s){s=null;fitSel()}};
});
function cropNow(){
  const r=mi.getBoundingClientRect(),nw=mi.naturalWidth,nh=mi.naturalHeight;
  const l=Math.max(B.l,r.left),t=Math.max(B.t,r.top),rr=Math.min(B.r,r.right),bb=Math.min(B.b,r.bottom);
  if(rr-l<20||bb-t<20){toast('Elegí una zona dentro del mapa');return null}
  const kx=nw/r.width,ky=nh/r.height,sx=(l-r.left)*kx,sy=(t-r.top)*ky,sw=(rr-l)*kx,sh=(bb-t)*ky,k=Math.min(1,2400/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext('2d').drawImage(mi,sx,sy,sw,sh,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.92));
}
$('#ck2').onclick=async()=>{
  const blob=await cropNow();if(!blob)return;
  modal('Guardar ubicación','<p>Número del territorio</p><div class="field"><input id="tn" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Solo números" enterkeyhint="done"></div>',[{t:'Cancelar'},{t:'Guardar',c:'pri',f:()=>{
    const n=parseInt($('#tn').value,10);if(isNaN(n)){toast('Escribí un número');return false}
    const i=terrs.findIndex(t=>t.num===n),it={num:n,blob};if(i>=0){drop(terrs[i]);terrs[i]=it}else terrs.push(it);
    terrs.sort((a,c)=>a.num-c.num);saveT();renderTerr();refreshTP();mv.classList.remove('crop');toast(i>=0?`Territorio ${n} reemplazado`:`Territorio ${n} guardado`);
  }}]);
};
document.addEventListener('input',e=>{if(e.target.id==='tn')e.target.value=e.target.value.replace(/\D/g,'')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tn')document.querySelector('#md .pri').click()});
$('#cx').onclick=()=>mv.classList.remove('crop');$('#mvg').onclick=startCrop;$('#mvx').onclick=closeView;$('#mvup').onclick=pick;

$('#mvd').onclick=()=>{const t=terrs[curT];askDel(`Se va a eliminar el territorio ${t.num}.`,()=>{drop(t);terrs.splice(curT,1);saveT();renderTerr();refreshTP();closeView()})};

$('#eye').onclick=()=>openView('map');
$('#mz').onclick=e=>{if(e.target.closest('.mact'))return;mapURL?openView('map'):pick()};
$('#mrep').onclick=pick;
$('#mdel').onclick=()=>askDel('Se va a eliminar el mapa actual. Los territorios guardados se conservan.',()=>{if(mapURL)URL.revokeObjectURL(mapURL);mapBlob=null;mapURL='';saveMap();renderTerr()});
$('#tg').onclick=e=>{const t=e.target.closest('.th');if(t)openView('ter',+t.dataset.t)};
/* selector inferior: la píldora sigue el dedo libremente */
const nb=$('#nb'),pill=$('#pill'),ORDN=['main','terr','mem','set'],CV='transform .65s cubic-bezier(.06,.92,.12,1),box-shadow .3s';let nd=false,pc=0,pt=0,raf=0;
const pw=()=>(nb.clientWidth-12)/4;let tl=0;
window.setPill=(i,a)=>{pill.style.transition=a?CV:'none';pill.style.transform=`translate3d(${i*pw()}px,0,0) scale(1)`;pill.classList.remove('drag')};
const hl=()=>{const i=Math.min(3,Math.max(0,Math.round(pt/pw())));$$('#nb button').forEach(b=>b.classList.toggle('on',b.dataset.go===ORDN[i]));return i};
const aim=cx=>{const r=nb.getBoundingClientRect(),w=pw();pt=Math.min(Math.max(cx-r.left-1-6-w/2,0),3*w);hl()};
const loop=t=>{const dt=Math.min(50,t-(tl||t));tl=t;pc+=(pt-pc)*(1-Math.exp(-dt/45));pill.style.transform=`translate3d(${pc}px,0,0) scale(1.1)`;raf=nd?requestAnimationFrame(loop):0};
nb.addEventListener('pointerdown',e=>{nb.setPointerCapture(e.pointerId);nd=true;tl=0;pc=new DOMMatrix(getComputedStyle(pill).transform).m41;pill.style.transition='none';pill.classList.add('drag');aim(e.clientX);if(!raf)raf=requestAnimationFrame(loop)});
nb.addEventListener('pointermove',e=>{if(nd)aim(e.clientX)});
const nEnd=()=>{if(!nd)return;nd=false;cancelAnimationFrame(raf);raf=0;const i=hl();setPill(i,true);requestAnimationFrame(()=>setTimeout(()=>go(ORDN[i]),30))};
nb.addEventListener('pointerup',nEnd);nb.addEventListener('pointercancel',nEnd);
addEventListener('resize',()=>setPill(ORDN.indexOf(cur),false));
setPill(0,false);
(async()=>{try{mapBlob=await DB.get('map')||null;terrs=await DB.get('terrs')||[]}catch(e){}if(mapBlob)mapURL=URL.createObjectURL(mapBlob);renderTerr();refreshTP()})();
})();
</script>
