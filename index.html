<style>
:root{--bg:#F1F6F3;--sf:#fff;--ink:#17261E;--soft:#6A7A71;--line:#E1EAE4;--acc:#1F8A5F;--acc2:#E3F4EB;--red:#C2512F;--fld:#F5F9F6;--sh:0 6px 24px rgba(23,60,40,.08);--lk:#2563EB}
:root[data-theme=dark]{--bg:#0E1512;--sf:#18221D;--ink:#E8F1EC;--soft:#93A59B;--line:#263229;--acc:#34B27F;--acc2:#1B3328;--red:#E57A58;--fld:#121B16;--sh:none;--lk:#6AA6FF;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',-apple-system,'Segoe UI',sans-serif;min-height:100vh}

svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:4px 16px calc(60px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bg);box-sizing:border-box;height:calc(env(safe-area-inset-top,0px) + 62px);padding:env(safe-area-inset-top,0px) max(16px,calc(50% - 304px)) 0;will-change:transform}#sc{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 62px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
header h1{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
header img{width:36px;height:36px;border-radius:50%}
.ib{background:none;border:0;padding:6px;cursor:pointer;color:var(--soft);border-radius:50%;display:flex}
.ib:active{background:var(--acc2);color:var(--acc)}
.sec{background:var(--sf);border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.st{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-bottom:14px}
.st svg{color:var(--acc)}.st .ib{margin-left:auto}
textarea{width:100%;min-height:170px;border:0;border-radius:20px;background:var(--fld);padding:14px 16px;font-size:16px;line-height:1.5;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--acc)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4}
.pri{background:var(--acc);color:#fff;margin-top:12px}
.soft{background:var(--acc2);color:var(--acc);margin-top:12px}
.exp{background:var(--fld);margin-top:10px;justify-content:center;padding:10px 20px}

.field{display:flex;align-items:center;gap:8px;background:var(--fld);border-radius:999px;padding:0 14px}
.field svg{color:var(--acc);width:19px;height:19px}
.field input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:16px;font-weight:600;width:100%}
.field input:focus{outline:0}
.field:focus-within{outline:2px solid var(--acc)}
.rc{background:var(--fld);border-radius:22px;padding:12px;margin-top:10px}
.rc.man{background:#FFF6E3}
:root[data-theme=dark] .rc.man{background:#2B2616}
.rc .top{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.rc .top input{flex:1;min-width:0;border:0;background:none;font-weight:800;font-size:16px;padding:4px 6px}
.rc .top input:focus{outline:0;background:var(--sf);border-radius:12px}
.rc .top .ib svg{width:18px;height:18px}
.rc .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.rc .g .field{background:var(--sf)}.rc .w{grid-column:1/3}
.dl{color:var(--red)!important}
.empty{display:flex;justify-content:center;padding:26px;color:var(--soft);opacity:.5}
.empty svg{width:44px;height:44px}
.li{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700}
.li:last-child{border:0}.li>span:first-child{color:var(--acc);display:flex}.li .ch{margin-left:auto;color:var(--soft);display:flex}
.seg{display:flex;gap:6px;background:var(--fld);border-radius:999px;padding:4px;margin-top:10px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;padding:9px 4px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;color:var(--soft)}
.seg button.on{background:var(--acc);color:#fff}
.seg svg{width:25px;height:25px}
.sw{position:relative;width:50px;height:30px;border-radius:999px;background:var(--line);margin-left:auto;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:600}
.chip .cn{flex:1;min-width:0;overflow-wrap:anywhere}.chip small{display:block;color:var(--acc);font-size:13px;margin-top:2px}
.add{display:flex;gap:8px;margin-bottom:10px}.add .field{flex:1}
.add .ib{background:var(--acc);color:#fff;padding:11px}
.about{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px;color:var(--soft);font-size:13px;font-weight:600}
.about div{display:flex;align-items:center;gap:8px}.about img{width:20px;height:20px}
.mini{color:var(--soft);font-size:13px;font-weight:700;background:none;border:0;display:flex;align-items:center;gap:6px;margin:14px auto 0;cursor:pointer}
.mini svg{width:16px;height:16px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.view{display:none}.view.on{display:block}

.st>span{display:flex}.field{min-width:0}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--soft);background:none;padding:0;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;flex:none;margin-right:4px}
.ck.on{background:var(--acc);border-color:var(--acc);color:#fff}.ck svg{width:16px;height:16px;stroke-width:3}
.src{margin:10px 6px 2px;font-size:11.5px;line-height:1.4;opacity:.45;white-space:pre-line;overflow-wrap:anywhere}
.lnk{color:var(--lk);text-decoration:underline;cursor:pointer}
#v-set.on{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - 110px)}
#v-set .about{margin-top:auto;padding:22px 0 8px}
.bk{display:flex;gap:10px}.bk .btn{margin-top:14px;padding:11px 10px;font-size:14px}
.dng{background:var(--red);color:#fff}
@keyframes fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes bkw{from{transform:translateX(-100%)}to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeo{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes popo{to{opacity:0;transform:scale(.94)}}
@keyframes rout{to{opacity:0;transform:translateX(34px) scale(.96)}}
.view.fwd{animation:fwd .32s cubic-bezier(.05,.85,.2,1)}.view.bk{animation:bkw .32s cubic-bezier(.05,.85,.2,1)}
.rc.out{animation:rout .22s forwards}
.btn,.ib,.ck,.seg button{transition:transform .15s,background-color .25s}
#md .mb{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30;animation:fade .2s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#md .mc{background:var(--sf);border-radius:28px;padding:22px;width:100%;max-width:400px;max-height:80vh;overflow:auto;animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
#md.closing .mb{animation:fadeo .2s forwards}#md.closing .mc{animation:popo .2s forwards}
.mc h3{margin:0 0 12px;font-size:19px;font-weight:800}.mc h4{margin:0 0 6px;font-size:15.5px;font-weight:800}.mc h4:not(:first-child){margin-top:18px}
.mc ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.55}.mc p{margin:0 0 12px;line-height:1.45}.mc .o{font-weight:800;color:var(--acc)}
.mbt{display:flex;gap:10px;margin-top:18px}.mbt .btn{margin:0;padding:12px}
[data-i]{display:inline-flex;align-items:center}svg.i{display:block}
.btn,.seg button,.li,.st,.chip{line-height:1.2}
header img{flex:none;display:block;object-fit:cover}
.exp img{width:auto;height:24px;max-width:26px}
.kb .wrap{padding-bottom:90vh}#rot{display:none}@media (orientation:landscape) and (max-height:520px){#rot{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:800;color:var(--soft)}#rot svg{width:48px;height:48px}}
.s1,.s2{transform-box:fill-box;transform-origin:center}
@keyframes tw1{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.45) rotate(30deg)}}
@keyframes tw2{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.9) rotate(-45deg)}}
#proc.go .s1{animation:tw1 .7s ease-out}#proc.go .s2{animation:tw2 .7s .12s ease-out}
.about{text-align:center}.about .lnk{font-weight:700}
.seg button{padding:11px 2px}.seg{gap:2px}
</style>
</head>

</div></div>

/* ===== LECTOR DE MENSAJES ===== */
//PARSER
const DAY_RE=new RegExp('^(Lunes|Martes|Mi[eé]rcoles|Jueves|Viernes|S[aá]bado|Domingo)\\b\\.?\\s*(\\d{1,2})?','i');
const PLACES=['arroyo dulce','rancagua','luard kayard'];
const ORD={Lunes:0,Martes:1,Miércoles:2,Jueves:3,Viernes:4,Sábado:5,Domingo:6};
const isNoise=l=>/^(salidas\s+(de\s+)?congregaci[oó]n|¿?alguna\s+duda\??)$/i.test(l.replace(/[^\p{L}\s?]/gu,'').trim());
const isTerrList=l=>/^\d{1,3}\s*[-–]\s*\d{1,3}(\s*(y|e|,|\/)\s*\d{1,3})*\.?$/.test(l);
const SKIP=/cada\s+uno|\bc\/u\b/i;
const cap=s=>s.replace(/(^|\s)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const normName=s=>s.toLowerCase().replace(/[^\p{L}\s]/gu,'').replace(/\s+/g,' ').trim();
const lead=s=>s.replace(/^[^\p{L}0-9]+/u,'').trim();
function normDay(n){const k=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return k==='miercoles'?'Miércoles':k==='sabado'?'Sábado':k[0].toUpperCase()+k.slice(1)}
function inferNum(n,last){if(!last)return'';const d=ORD[n]-ORD[last.name];return isNaN(d)?'':String(last.num+d)}
function fields(parts){
  let txt=parts.map(p=>p.replace(/\(?\bferiado\b\)?/ig,'').trim()).filter(Boolean).join(' | '),hora='',terr='',cond='';
  txt=txt.replace(/(\d{1,2})[:.](\d{2})\s*(?:hs?\b\.?)?/i,(m,h,mi)=>{hora=h.padStart(2,'0')+':'+mi;return' '});
  txt=txt.replace(/\b(?:terr(?:itorios?)?|t)\b\.?\s*[:;]?\s*(\d+(?:\s*(?:-|,|y|e)\s*\d+)*)/i,(m,t)=>{terr=t.replace(/\s*(?:y|e|,)\s*/gi,', ').replace(/\s*-\s*/g,'-');return' '});
  const cm=txt.match(/\bcond(?:uctor)?\b\.?\s*[:;]?\s*([^|]*)/i);
  if(cm){cond=cm[1];txt=txt.slice(0,cm.index)+' '+txt.slice(cm.index+cm[0].length)}
  let segs=txt.split('|').map(s=>s.trim()).filter(s=>s.replace(/[\W_]/g,''));
  if(cm){const k=normName(cond);segs=segs.filter(s=>normName(s)!==k)}
  else if(segs.length>1&&segs[segs.length-1].split(/\s+/).length<=4&&!/\)\s*\.?$/.test(segs[segs.length-1]))cond=segs.pop();
  else if(segs.length===1&&!/\)\s*\.?$/.test(segs[0])){const w=segs[0].replace(/[.\s]+$/,'').split(/\s+/);if(w.length>2){cond=w.slice(-2).join(' ');segs[0]=w.slice(0,-2).join(' ')}}
  const extra=[];
  cond=cond.replace(/\(([^)]*)\)/g,(m,x)=>{extra.push(x.trim());return' '});
  PLACES.forEach(p=>{const r=new RegExp(p,'i');if(r.test(cond)){extra.push(p);cond=cond.replace(r,' ')}});
  let w=cond.replace(/[.;:,|]/g,' ').split(/\s+/).filter(Boolean);
  const h=w.length/2;
  if(w.length>1&&w.length%2===0&&w.slice(0,h).join(' ').toLowerCase()===w.slice(h).join(' ').toLowerCase())w=w.slice(0,h);
  w=w.map(x=>cap(x));
  let lugar=segs.join(' ').replace(/\bT\b\.?\s*$/i,'').replace(/^[\s.,\-:;]+|[\s.,\-:;]+$/g,'').replace(/\s{2,}/g,' ');
  extra.forEach(x=>{if(x)lugar+=` (${cap(x)})`});
  lugar=lugar.charAt(0).toUpperCase()+lugar.slice(1);lugar=lugar.replace(/\(([^)]*)\)/g,(m,x)=>'('+cap(x)+')');
  return{hora,lugar:lugar.trim(),territorio:terr,conductor:w.join(' ')};
}
function parseMessage(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l&&!isNoise(l)&&!isTerrList(l));
  const out=[],blank=dia=>({dia,hora:'',lugar:'',territorio:'',conductor:'',manual:true});
  let i=0,last=null;
  while(i<lines.length){
    const clean=lead(lines[i]),hm=clean.match(DAY_RE);
    if(!hm){i++;continue}
    const name=normDay(hm[1]);let num=hm[2]||'',used=hm[0].length;
    if(num&&clean[used]===':'){used-=num.length;num=''}
    if(!num&&last&&last.name===name)num=String(last.num);
    if(num)last={name,num:+num};
    const dia=num?name+' '+num:name;
    const left=clean.slice(used).replace(/\(?\bferiado\b\)?/ig,'').trim();
    const combo=/^y\s+(domingo|s[aá]bado)/i.exec(left);
    let dia2='';
    if(combo){const n2=normDay(combo[1]),d=inferNum(n2,last);dia2=d?n2+' '+d:n2;if(d)last={name:n2,num:+d}}
    const next=lines[i+1]||'',hdr=lines[i];
    if(SKIP.test(left)||SKIP.test(next)){
      i+=SKIP.test(next)?2:1;
      const p=num?dia:(inferNum(name,last)?name+' '+inferNum(name,last):dia);
      const s0=hdr+(SKIP.test(next)?'\n'+next:'');out.push({...blank(p),src:s0});if(dia2)out.push({...blank(dia2),src:s0});continue;
    }
    const parts=[];if(left&&!combo)parts.push(left);
    let j=i+1;
    while(j<lines.length&&parts.length<2){if(DAY_RE.test(lead(lines[j])))break;parts.push(lines[j]);j++}
    i=j;
    if(parts.length)out.push({dia,...fields(parts),manual:false,src:[hdr,...parts.slice(left&&!combo?1:0)].join('\n')});
  }
  const w=out.findIndex(r=>/^Mi[ée]rcoles/i.test(r.dia));
  if(w!==-1)out.splice(w+1,0,blank(out[w].dia));
  return out;
}
///PARSER
function guessSub(r){
  const d=r.map(x=>x.dia.match(/^(\D+?)\s*(\d{1,2})$/)).filter(Boolean).map(m=>+m[2]);
  if(!d.length)return'';
  const t=new Date(),m1=t.getMonth()+1,a=d[0],b=d[d.length-1];
  return`Del ${a}/${m1} al ${b}/${b<a?(m1===12?1:m1+1):m1}`;
}

/* copia de seguridad (AES-GCM, formato propio .g7mem) */
async function ckey(){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode('G7-salidas-memoria-v1'),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode('g7-salt'),iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encMem(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(),new TextEncoder().encode(JSON.stringify({app:'g7',v:1,mem}))));const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return new Blob([new TextEncoder().encode('G7MEM1'),all],{type:'application/octet-stream'})}
async function decMem(buf){const u=new Uint8Array(buf);if(new TextDecoder().decode(u.slice(0,6))!=='G7MEM1')throw 0;const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(6,18)},await ckey(),u.slice(18));return JSON.parse(new TextDecoder().decode(pt)).mem}
function mergeMem(m){['nombres','territorios','lugares'].forEach(k=>{(m[k]||[]).forEach(v=>addMem(k,v));Object.assign(mem.rep[k],(m.rep||{})[k]||{})});saveMem()}

async function out(blob,name,type){const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}dl(blob,name)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function drawCanvas(){
  const W=1600,rh=100,hh=104,top=270,cols=[20.39,12.76,50.96,10.5,29.84],tot=cols.reduce((a,b)=>a+b),M=40;
  const cw=cols.map(c=>c/tot*(W-2*M)),H=top+hh+rows.length*rh+M;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';
  const F='Nunito,Bahnschrift,Arial,sans-serif';
  const fit=(t,w,s,st)=>{let z=s;do{x.font=`${st} ${z}px ${F}`;z-=2}while(x.measureText(t).width>w-24&&z>14);x.fillText(t,0,0)};
  const put=(t,cx,cy,w,s,st)=>{x.save();x.translate(cx,cy);fit(t,w,s,st);x.restore()};
  put('Salidas de Congregación y del Grupo 7',W/2,100,W-2*M,70,'800');
  put($('#sub').value||'',W/2,190,W-2*M,56,'700');
  x.lineWidth=2.5;x.strokeStyle='#000';
  const line=(y,h,fill,items,bold,it)=>{
    let px=M;items.forEach((t,k)=>{
      if(fill){x.fillStyle=fill;x.fillRect(px,y,cw[k],h)}
      x.strokeRect(px,y,cw[k],h);x.fillStyle='#000';
      put(t,px+cw[k]/2,y+h/2,cw[k],bold?44:40,(bold?'800 ':(it[k]?'italic 600 ':'600 ')).trim().replace(/^(\d+) /,'$1 '));
      px+=cw[k]});
  };
  line(top,hh,'#00FE7F',['Día','Hora','Lugar de encuentro','Territorio','Conductor'],true,[]);
  rows.forEach((r,i)=>line(top+hh+i*rh,rh,null,[r.dia,r.hora,r.lugar,r.territorio,r.conductor],false,[1,0,1,0,1]));
  return c;
}
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));

function makePDF(){
  const c=drawCanvas(),ls=c.height/c.width<1.1,pdf=new jspdf.jsPDF({orientation:ls?'landscape':'portrait',unit:'mm',format:'a4'});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),k=Math.min((pw-16)/c.width,(ph-16)/c.height);
  pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',(pw-c.width*k)/2,8,c.width*k,c.height*k);
  return out(pdf.output('blob'),'Salidas_G7.pdf','application/pdf');
}

  $('#rows').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.c!==undefined){const r=rows[+b.dataset.c];r.manual=!r.manual;b.classList.toggle('on',r.manual);b.closest('.rc').classList.toggle('man',r.manual)}
    else if(b.dataset.x!==undefined){const i=+b.dataset.x;b.closest('.rc').classList.add('out');setTimeout(()=>{rows.splice(i,1);renderRows()},220)}
    else if(b.dataset.m){const[i,d]=b.dataset.m.split(':').map(Number);[rows[i],rows[i+d]]=[rows[i+d],rows[i]];renderRows()}
  });
  $('#b-wa').onclick=e=>guard(e.currentTarget,shareWA);
  $('#b-xl').onclick=e=>guard(e.currentTarget,makeXLSX);
  $('#b-pdf').onclick=e=>guard(e.currentTarget,async()=>makePDF());
  $$('#mtabs button').forEach(b=>b.onclick=()=>{mtab=b.dataset.k;renderMem()});
  $('#madd').onclick=()=>{addMem(mtab,$('#mi').value);$('#mi').value='';saveMem();renderMem()};
  $('#mi').addEventListener('keydown',e=>{if(e.key==='Enter')$('#madd').click()});
  $('#mlist').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.r!==undefined)askRep(+b.dataset.r);
    else{const i=+b.dataset.d,v=mem[mtab][i];askDel(`Se va a eliminar «${esc(v)}» de la memoria.`,()=>{mem[mtab].splice(i,1);delete mem.rep[mtab][rk(v)];saveMem();renderMem()})}
  };
  $('#mclear').onclick=()=>askDel('Se van a eliminar todos los ítems de esta categoría.',()=>{mem[mtab]=[];mem.rep[mtab]={};saveMem();renderMem()});
  $('#mbk').onclick=async()=>{try{await out(await encMem(),'Memoria_G7.g7mem','application/octet-stream')}catch(e){toast('No se pudo crear la copia')}};
  $('#mimp').onclick=()=>$('#fi').click();
  $('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{mergeMem(await decMem(await f.arrayBuffer()));renderMem();toast('Memoria importada')}catch(x){toast('Archivo no válido')}};
});
</script>
<!--PWA-->
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
<!--/PWA-->
</body>
